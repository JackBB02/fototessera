<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Fototessera</title>
<style>
  :root {
    --bg-color: #000000;
    --card-bg: #1c1c1e;
    --primary: #0a84ff;
    --text: #ffffff;
    --secondary: #636366;
    --border: #3a3a3c;
    --action: #30d158;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background-color: var(--bg-color);
    color: var(--text);
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
  }

  .container { max-width: 500px; width: 100%; }

  h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; text-align: center; color: var(--text); }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

  .slot {
    aspect-ratio: 35/45;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: #000;
  }

  .slot.active { border-color: var(--primary); background: #002e63; }

  .btn-container { display: flex; gap: 8px; margin-bottom: 8px; }

  .btn {
    flex: 1;
    padding: 10px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .btn-secondary { background: var(--secondary); color: white; }
  .btn-action { background: var(--action); color: white; }

  /* Modal styles */
  .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
      background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center; width: 80%; max-width: 300px;
      color: var(--text); border: 1px solid var(--border);
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Fototessera</h1>

  <div class="card">
    <div class="btn-container" style="flex-wrap: wrap; margin-bottom: 8px;">
      <button class="btn" onclick="document.getElementById('input-camera').click()">Scatta</button>
      <button class="btn btn-secondary" onclick="document.getElementById('input-gallery').click()">Galleria</button>
      <button class="btn btn-action" id="btn-select-all">Tutto</button>
      <button class="btn btn-secondary" id="btn-deselect-all">Niente</button>
    </div>
  </div>

  <div class="card">
    <div id="grid" class="grid"></div>
  </div>

  <input type="file" id="input-camera" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="input-gallery" accept="image/*" style="display:none">
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3>Foto caricata!</h3>
        <p>Seleziona le foto dalla griglia e procedi.</p>
        <button class="btn btn-action" id="btn-pdf-modal">Genera PDF A4</button>
        <button class="btn btn-secondary" onclick="document.getElementById('modal').style.display='none'" style="margin-top:10px;">Chiudi</button>
    </div>
</div>

<script>
  let dataUrl = null;
  let selected = new Array(30).fill(false);
  const gridEl = document.getElementById('grid');
  const slots = [];

  for(let i=0; i<30; i++) {
    let div = document.createElement('div');
    div.className = 'slot';
    div.onclick = () => { toggleSlot(i); };
    gridEl.appendChild(div);
    slots.push(div);
  }

  function toggleSlot(i) {
      selected[i] = !selected[i];
      slots[i].classList.toggle('active', selected[i]);
  }

  document.getElementById('btn-select-all').onclick = () => {
    selected.fill(true);
    slots.forEach(s => s.classList.add('active'));
  };

  document.getElementById('btn-deselect-all').onclick = () => {
    selected.fill(false);
    slots.forEach(s => s.classList.remove('active'));
  };

  function handleFile(file) {
    let reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 350; canvas.height = 450;
            canvas.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 350, 450);
            dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('modal').style.display = 'flex';
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('input-camera').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);
  document.getElementById('input-gallery').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);

  function generatePDF() {
    if(!dataUrl) return alert('Carica una foto');
    const { jsPDF } = window.jspdf || window;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });


    selected.forEach((active, i) => {
        if(active) {
            let row = Math.floor(i / 5);
            let col = i % 5;
            doc.addImage(dataUrl, 'JPEG', 11.5 + (col*38) + 1.5, 6 + (row*48) + 1.5, 35, 45);
        }
    });
    doc.save('fototessera_a4.pdf');
    document.getElementById('modal').style.display = 'none';
  }

  document.getElementById('btn-pdf-modal').onclick = generatePDF;
</script>
</body>
</html>
