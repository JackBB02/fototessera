<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Fototessera</title>
<style>
  :root {
    --bg-color: #f2f2f7;
    --card-bg: rgba(255, 255, 255, 0.9);
    --primary: #007aff;
    --text: #000;
    --secondary: #8E8E93;
    --border: rgba(0, 0, 0, 0.05);
    --action: #34c759;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background-color: var(--bg-color);
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
  }

  .container { max-width: 500px; width: 100%; }

  h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; text-align: center; }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

  .slot {
    aspect-ratio: 35/45;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
  }

  .slot.active { border-color: var(--primary); background: #e0f2fe; }

  .btn-container { display: flex; gap: 8px; margin-bottom: 8px; }

  .btn {
    flex: 1;
    padding: 10px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .btn-secondary { background: var(--secondary); }
  .btn-action { background: var(--action); }

  .pdf-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 0;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Fototessera</h1>

  <div class="card">
    <div class="btn-container" style="flex-wrap: wrap; margin-bottom: 8px;">
      <button class="btn" onclick="document.getElementById('input-camera').click()">Scatta</button>
      <button class="btn btn-secondary" onclick="document.getElementById('input-gallery').click()">Galleria</button>
      <button class="btn btn-action" id="btn-select-all">Tutto</button>
      <button class="btn btn-secondary" id="btn-deselect-all">Niente</button>
    </div>
  </div>

  <div class="card">
    <div id="grid" class="grid"></div>
  </div>

  <input type="file" id="input-camera" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="input-gallery" accept="image/*" style="display:none">

  <button class="btn pdf-btn" id="btn-pdf">Genera PDF A4</button>
</div>

<script>
  let dataUrl = null;
  let selected = new Array(30).fill(false);
  const gridEl = document.getElementById('grid');
  const slots = [];

  for(let i=0; i<30; i++) {
    let div = document.createElement('div');
    div.className = 'slot';
    div.onclick = () => { toggleSlot(i); };
    gridEl.appendChild(div);
    slots.push(div);
  }

  function toggleSlot(i) {
      selected[i] = !selected[i];
      slots[i].classList.toggle('active', selected[i]);
  }

  document.getElementById('btn-select-all').onclick = () => {
    selected.fill(true);
    slots.forEach(s => s.classList.add('active'));
  };

  document.getElementById('btn-deselect-all').onclick = () => {
    selected.fill(false);
    slots.forEach(s => s.classList.remove('active'));
  };

  function handleFile(file) {
    let reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 350; canvas.height = 450;
            canvas.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 350, 450);
            dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            alert('Foto caricata!');
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('input-camera').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);
  document.getElementById('input-gallery').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);

  document.getElementById('btn-pdf').onclick = () => {
    if(!dataUrl) return alert('Carica una foto');
    const { jsPDF } = window.jspdf || window;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    selected.forEach((active, i) => {
        if(active) {
            let row = Math.floor(i / 5);
            let col = i % 5;
            // Posizionamento foto senza linee di taglio
            doc.addImage(dataUrl, 'JPEG', 11.5 + (col*38) + 1.5, 6 + (row*48) + 1.5, 35, 45);
        }
    });
    doc.save('fototessera_a4.pdf');
  };
</script>
</body>
</html>
