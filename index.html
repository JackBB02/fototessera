<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fototessera A5</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .btn { padding: 15px 30px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
  #canvas-preview { max-width: 100%; height: auto; }
</style>
<!-- Caricamento robusto della libreria -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>Fototessera A5 (Layout Orizzontale)</h1>
<input type="file" id="input" accept="image/*">
<div id="status"></div>
<button class="btn" id="btn-pdf">Genera PDF (A5 Orizzontale)</button>

<script>
  let dataUrl = null;
  // Utility per verificare l'oggetto
  function checkLib() {
      // Alcune versioni di jspdf mettono jsPDF direttamente in window
      if (typeof window.jspdf !== 'undefined') return window.jspdf.jsPDF;
      if (typeof window.jsPDF !== 'undefined') return window.jsPDF;
      return null;
  }

  document.getElementById('input').onchange = (e) => {
    let reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 350; canvas.height = 450;
            canvas.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 350, 450);
            dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('status').innerText = "Foto caricata.";
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
  };

  document.getElementById('btn-pdf').onclick = () => {
    if(!dataUrl) return alert('Carica prima una foto');

    // Tentativo di recupero libreria
    const jsPDF = checkLib();
    if(!jsPDF) return alert('Libreria PDF non caricata. Controlla connessione.');

    try {
        // Formato [width, height] in mm (A5 Orizzontale: 210x148)
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [210, 148] });

        // Layout 4 colonne, 2 righe
        for(let row=0; row<2; row++) {
            for(let col=0; col<4; col++) {
                doc.addImage(dataUrl, 'JPEG', 10 + (col*40), 10 + (row*55), 35, 45);
            }
        }
        doc.save('fototessera_a5.pdf');
    } catch (e) {
        alert('Errore PDF: ' + e.message);
    }
  };
</script>
</body>
</html>
