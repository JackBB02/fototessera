<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fototessera A4 Guida Taglio</title>
<style>
  body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 20px 0; }
  .slot { width: 30px; height: 38px; border: 2px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .slot.active { border-color: #3B82F6; background: #e0f2fe; }
  .btn-container { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn { padding: 15px 20px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; }
  .btn-secondary { background: #6B7280; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>Layout (30 su A4) + Taglio</h1>

<div class="btn-container">
  <button class="btn" onclick="document.getElementById('input-camera').click()">Scatta Foto</button>
  <button class="btn btn-secondary" onclick="document.getElementById('input-gallery').click()">Galleria</button>
</div>

<input type="file" id="input-camera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="input-gallery" accept="image/*" style="display:none">

<div id="grid" class="grid"></div>
<button class="btn" id="btn-pdf">Genera PDF con Guide</button>

<script>
  let dataUrl = null;
  let selected = new Array(30).fill(false);
  const gridEl = document.getElementById('grid');

  for(let i=0; i<30; i++) {
    let div = document.createElement('div');
    div.className = 'slot';
    div.onclick = () => { selected[i] = !selected[i]; div.classList.toggle('active'); };
    gridEl.appendChild(div);
  }

  function handleFile(file) {
    let reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 350; canvas.height = 450;
            canvas.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 350, 450);
            dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            alert('Foto caricata!');
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('input-camera').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);
  document.getElementById('input-gallery').onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);

  document.getElementById('btn-pdf').onclick = () => {
    if(!dataUrl) return alert('Carica prima una foto');
    const { jsPDF } = window.jspdf || window;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    // Configurazione guide
    doc.setDrawColor(200, 200, 200);
    doc.setLineDash([1, 1], 0); // Tratteggio

    // Disegna linee di taglio
    // Verticali
    for(let col=0; col<=5; col++) {
        doc.line(11.5 + col*38, 6, 11.5 + col*38, 291);
    }
    // Orizzontali
    for(let row=0; row<=6; row++) {
        doc.line(11.5, 6 + row*48, 201.5, 6 + row*48);
    }

    // Aggiungi foto
    selected.forEach((active, i) => {
        if(active) {
            let row = Math.floor(i / 5);
            let col = i % 5;
            doc.addImage(dataUrl, 'JPEG', 11.5 + (col*38), 6 + (row*48), 35, 45);
        }
    });
    doc.save('fototessera_a4_guide.pdf');
  };
</script>
</body>
</html>
